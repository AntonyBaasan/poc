spring:
  application:
    name: hostmonolith
  datasource:
    url: jdbc:postgresql://localhost:5432/hostmonolith
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
